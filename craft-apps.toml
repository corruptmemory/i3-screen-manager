# craft-apps.toml — the ArtCraft apps (https://getartcraft.com/apps) that
# `craft-apps` launches with agent control and bridges to MCP clients.
#
# Each app gets a fixed loopback control port, the same on every machine, so a
# controlled app and its MCP bridge always agree. The block 18701-18714 sits
# below Linux's ephemeral port range (32768-60999), so outgoing connections
# never take it. The apps spell their control and bridge flags differently, so
# every row records its own argv. A row is used only once `verified` names the
# version whose `--help` (and a live `craft-apps probe`) confirmed those flags.
#
# Placeholders in control_args / bridge_args:
#   {port}        the app's control port
#   {token_file}  ~/.local/state/craft-control/<app>.token (created 0600)
#   {read_root}   directory the app may read through automation
#   {write_root}  directory the app may write through automation

[defaults]
read_root = "~"
write_root = "~"

[apps.photocraft]
port = 18701
command = "photocraft"
cli = "photocraft-cli"
desktop = "ai.storyteller.photocraft.desktop"
verified = "0.12.0"
control_args = ["--control", "{port}", "--control-token-file", "{token_file}",
                "--automation-read-root", "{read_root}",
                "--automation-write-root", "{write_root}"]
bridge_args = ["mcp", "--bridge", "127.0.0.1:{port}", "--control-token-file", "{token_file}"]
probe_tool = "session_list"

# The rest are filled in from each app's docs at its installed tag
# (docs/mcp.md, docs/control-protocol.md) and its --help. They differ:
# - Only PhotoCraft, FigCraft and VectorCraft take automation roots on the app;
#   the others' running apps are not confined (their docs say so) and refuse
#   roots alongside a bridge, so the agent can reach any file the user can.
# - Only PhotoCraft (token file) and WordCraft (a key the app writes to
#   ~/.config/wordcraft/control-key.local-<port> each start, which its bridge
#   reads) authenticate; the rest accept any local client on their port.
# - CADCraft's bridge needs --lazy to start before the app is running. Six
#   bridges have no such option and exit when their app is down; their rows
#   set needs_app_at_start (see `craft-apps bridge`).

[apps.artcraft]
port = 18702
command = "artcraft"

[apps.vectorcraft]
port = 18703
command = "vectorcraft"
cli = "vectorcraft-cli"
desktop = "ai.storyteller.vectorcraft.desktop"
verified = "0.14.0"
control_args = ["--control", "{port}", "--automation-read-root", "{read_root}",
                "--automation-write-root", "{write_root}"]
# An explicit --connect; with no flag the server falls back to a headless session.
bridge_args = ["mcp", "--connect", "127.0.0.1:{port}"]
probe_tool = "ui_inspect"
# The bridge exits when the app is down, so register the lazy proxy.
needs_app_at_start = true
headless_args = ["mcp", "--headless"]

[apps.filmcraft]
port = 18704
command = "filmcraft"
cli = "filmcraft-cli"
desktop = "ai.storyteller.filmcraft.desktop"
verified = "0.10.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--bridge", "127.0.0.1:{port}"]
probe_tool = "ui_inspect"

[apps.lightcraft]
port = 18705
command = "lightcraft"
cli = "lightcraft-cli"
desktop = "ai.storyteller.lightcraft.desktop"
verified = "0.11.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--connect", "127.0.0.1:{port}"]
probe_tool = "ui_inspect"

# PdfCraft: `pdfcraft-cli mcp` always runs its own headless session ("there is no
# flag to connect it to a running app"); the app's --control takes a control file
# that only `pdfcraft-cli ui` uses. No live bridge, so no launcher or MCP row.
[apps.pdfcraft]
port = 18706
command = "pdfcraft"

[apps.effectcraft]
port = 18707
command = "effectcraft"
cli = "effectcraft-cli"
desktop = "ai.storyteller.effectcraft.desktop"
verified = "0.14.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--bridge", "{port}"]
probe_tool = "ui_inspect"

[apps.designcraft]
port = 18708
command = "designcraft"
cli = "designcraft-cli"
desktop = "ai.storyteller.designcraft.desktop"
verified = "0.11.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--connect", "{port}"]
probe_tool = "ui_inspect"
# The bridge exits when the app is down, so register the lazy proxy.
needs_app_at_start = true
headless_args = ["mcp"]

[apps.figcraft]
port = 18709
command = "figcraft"
cli = "figcraft-cli"
desktop = "ai.storyteller.figcraft.desktop"
verified = "0.9.0"
control_args = ["--control", "{port}", "--automation-read-root", "{read_root}",
                "--automation-write-root", "{write_root}"]
bridge_args = ["mcp", "--attach", "{port}"]
probe_tool = "inspect_ui"
# The bridge exits when the app is down, so register the lazy proxy.
needs_app_at_start = true
headless_args = ["mcp"]

[apps.wordcraft]
port = 18710
command = "wordcraft"
cli = "wordcraft-cli"
desktop = "ai.storyteller.wordcraft.desktop"
verified = "0.9.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--connect", "127.0.0.1:{port}"]
probe_tool = "ui_inspect"
# The bridge exits when the app is down, so register the lazy proxy.
needs_app_at_start = true
headless_args = ["mcp"]

[apps.soundcraft]
port = 18711
command = "soundcraft"
cli = "soundcraft-cli"
desktop = "ai.storyteller.soundcraft.desktop"
verified = "0.11.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--connect", "{port}"]
probe_tool = "ui_inspect"

[apps.deckcraft]
port = 18712
command = "deckcraft"
cli = "deckcraft-cli"
desktop = "ai.storyteller.deckcraft.desktop"
verified = "0.9.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--connect", "{port}"]
probe_tool = "screenshot"
# The bridge exits when the app is down, so register the lazy proxy.
needs_app_at_start = true
headless_args = ["mcp"]

[apps.cadcraft]
port = 18713
command = "cadcraft"
cli = "cadcraft-cli"
desktop = "ai.storyteller.cadcraft.desktop"
verified = "0.10.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--connect", "127.0.0.1:{port}", "--lazy"]
probe_tool = "ui_inspect"

[apps.gridcraft]
port = 18714
command = "gridcraft"
cli = "gridcraft-cli"
desktop = "ai.storyteller.gridcraft.desktop"
verified = "0.10.0"
control_args = ["--control", "{port}"]
bridge_args = ["mcp", "--connect", "{port}"]
probe_tool = "inspect_workbook"
# The bridge exits when the app is down, so register the lazy proxy.
needs_app_at_start = true
headless_args = ["mcp"]
